name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Mobile app (typecheck, tests, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run check:secrets

  edge-function:
    name: Edge Function (Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/fetch-sec-filings/deno.json supabase/functions/fetch-sec-filings/index.ts
      - run: deno test --config supabase/functions/fetch-sec-filings/deno.json --allow-read supabase/functions/tests/

  database:
    name: Database (migrations, WISI trigger, RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-db.sh
